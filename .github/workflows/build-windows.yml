name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore PcInformation.csproj
      - name: Compile Release
        run: dotnet build PcInformation.csproj --configuration Release --no-restore
      - name: Publish standalone Windows x64 app
        run: dotnet publish PcInformation.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./artifacts/PcInformation-win-x64
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PcInformation.iss'
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: PcInformation-portable-win-x64
          path: ./artifacts/PcInformation-win-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PcInformation-Setup-win-x64
          path: ./artifacts/PcInformation-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30
