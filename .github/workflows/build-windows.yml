name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PcInformation.csproj
      - name: Build
        run: dotnet build PcInformation.csproj --configuration Release --no-restore
      - name: Publish standalone EXE
        run: dotnet publish PcInformation.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./artifacts/PcInformation-win-x64
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PcInformation-win-x64
          path: ./artifacts/PcInformation-win-x64/
          if-no-files-found: error
          retention-days: 30
